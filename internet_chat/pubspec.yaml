name: internet_chat
description: >-
  A chat between dart_libp2p peers over the internet: a public relay that is
  also the DHT bootstrap node, and peers behind NAT that find each other
  through the DHT, chat over GossipSub and hole-punch direct connections.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.5.0
  dart_libp2p: ^4.1.0
  dart_libp2p_kad_dht: ^1.4.1
  dart_libp2p_pubsub: ^1.4.2
  dart_udx: ^4.0.0
  dcid: ^1.0.0
  logging: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
